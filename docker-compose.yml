services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: assetbox
      MYSQL_USER: assetbox
      MYSQL_PASSWORD: assetbox
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql

  prometheus:
    image: prom/prometheus:v2.52.0
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro

volumes:
  mysql-data:
